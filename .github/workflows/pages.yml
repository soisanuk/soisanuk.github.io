name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --test

      # The extension is COPIES of web/js sources plus styles extracted from
      # index.html. Nothing stops someone editing a source and shipping an
      # extension still carrying the old one, except this. CLAUDE.md claimed
      # CI ran it before CI actually did.
      - name: Check the extension matches its sources
        run: node scripts/build-extension.mjs --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker cache version
        run: sed -i "s/soisanuk-dev/soisanuk-${GITHUB_SHA::7}/" web/sw.js
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web

<!doctype html>
<meta charset="utf-8">
<title>A page with opinions about CSS</title>
<style>
  /* The kind of thing real sites do. If the card rendered in this document,
     every one of these would land on it. */
  * { box-sizing: content-box !important; letter-spacing: 3px !important; }
  div { color: #b00 !important; font-size: 31px !important; background: #ffd !important; }
  /* class names a Thai reader plausibly collides with */
  .example { border: 6px dashed #b00 !important; padding: 20px !important; }
  .rtgs    { text-transform: uppercase !important; color: #0b0 !important; }
  .w-token { outline: 4px solid #b00 !important; }
  .tt-thai { font-size: 60px !important; }
</style>

<p id="prose" class="example">ผมอยากกินข้าว — an .example the PAGE owns</p>
<p id="rom" class="rtgs">phom yaak kin khaao — a .rtgs the page owns</p>
<div id="plain">a plain div the page owns</div>
